[project]
name = "benchmarking-nature-tsfm"
version = "0.2.0"
description = "Reusable toolkit for optical-flow time-series extraction and generic forecasting evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.10.0",
    "pandas>=2.3.1",
    "xlrd>=2.0.2",
]

[project.scripts]
rvtsfm-extract = "real_v_tsfm.cli.extract:main"
rvtsfm-eval = "real_v_tsfm.cli.eval:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
